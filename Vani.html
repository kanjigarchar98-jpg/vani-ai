<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>વાણી (Vani) AI</title>
    <style>
        body {
            background-color: #000080; /* Navy Blue */
            color: #FFD700; /* Gold */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p.subtitle { font-size: 1.2em; margin-top: 0; color: #FFF8DC; }
        #chat-box {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 600px;
            min-height: 150px;
            border: 2px solid #FFD700;
        }
        button {
            background-color: #FFD700;
            color: #000080;
            font-size: 1.5em;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #FFF8DC; }
        #status { margin-top: 15px; font-style: italic; color: #ccc; }
    </style>
</head>
<body>

    <h1>વાણી AI</h1>
    <p class="subtitle">તમારી પોતાની સ્માર્ટ આસિસ્ટન્ટ</p>
    <button id="talk-btn" onclick="startListening()">વાણી સાથે વાત કરો 🎤</button>
    <div id="status">માઈક ચાલુ કરવા માટે બટન દબાવો...</div>
    
    <div id="chat-box">
        <p id="user-text">તમારો અવાજ અહીં દેખાશે...</p>
        <hr style="border-color: #FFD700;">
        <p id="jarvis-response">વાણીનો જવાબ અહીં આવશે...</p>
    </div>

    <script>
        // તમે આપેલી Gemini API Key
        const API_KEY = "AQ.Ab8RN6JeYYcX_HUdH21nlT1rlDQIHSCfOAhTnjDeMp-y9fdyVw"; 

        const statusText = document.getElementById("status");
        const userText = document.getElementById("user-text");
        const jarvisResponse = document.getElementById("jarvis-response");

        // Web Speech API (સાંભળવા માટે)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'gu-IN'; // ગુજરાતી ભાષા 

        function startListening() {
            recognition.start();
            statusText.innerText = "વાણી સાંભળી રહી છે...";
            statusText.style.color = "#FFD700";
        }

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            userText.innerText = "તમે કહ્યું: " + transcript;
            statusText.innerText = "વાણી વિચારી રહી છે...";
            
            fetchGeminiResponse(transcript);
        };

        recognition.onerror = (event) => {
            statusText.innerText = "અવાજ પકડાયો નહીં. ફરી પ્રયત્ન કરો.";
            statusText.style.color = "red";
        };

        async function fetchGeminiResponse(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            // વાણીનું વ્યક્તિત્વ (Personality) સેટ કર્યું છે
            const promptText = "તારું નામ વાણી (Vani) છે. તું એક ખૂબ જ હોશિયાર, નમ્ર અને મીઠી ભાષામાં વાત કરતી આસિસ્ટન્ટ છે. તારે ટૂંકમાં અને સ્પષ્ટ ગુજરાતીમાં જવાબ આપવાનો છે. મારો પ્રશ્ન: " + text;

            const data = {
                contents: [{ parts: [{ text: promptText }] }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const aiText = result.candidates[0].content.parts[0].text;
                
                jarvisResponse.innerText = aiText;
                statusText.innerText = "જવાબ તૈયાર છે!";
                
                speakText(aiText);
                
            } catch (error) {
                jarvisResponse.innerText = "કોઈ ભૂલ આવી. ઇન્ટરનેટ કનેક્શન કે API કી ચેક કરો.";
            }
        }

        // મધુર અને મીઠા અવાજ માટેનું સેટિંગ
        function speakText(text) {
            // વોઇસ એન્જિનને લોડ થવા માટે થોડો સમય આપવો જરૂરી છે
            let voices = window.speechSynthesis.getVoices();
            
            const speech = new SpeechSynthesisUtterance();
            speech.text = text;
            speech.lang = 'gu-IN'; 
            
            // અવાજ પાતળો અને યુવાન સ્ત્રી જેવો કરવા માટે પિચ (pitch) વધારી છે
            speech.pitch = 1.3; 
            // બોલવાની ઝડપ એકદમ નોર્મલ રાખી છે જેથી સ્પષ્ટ સમજાય
            speech.rate = 1.0;  
            
            window.speechSynthesis.speak(speech);
        }

        // બ્રાઉઝર ઓપન થાય ત્યારે વોઇસ લિસ્ટ લોડ કરવા માટે
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
