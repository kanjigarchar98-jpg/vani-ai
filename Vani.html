<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>વાણી (Vani) AI</title>
    <style>
        body { background-color: #000080; color: #FFD700; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p.subtitle { font-size: 1.2em; margin-top: 0; color: #FFF8DC; }
        #chat-box { background-color: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 600px; min-height: 150px; border: 2px solid #FFD700; }
        button { background-color: #FFD700; color: #000080; font-size: 1.5em; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #status { margin-top: 15px; font-style: italic; color: #ccc; }
        #main-interface { display: none; }
    </style>
</head>
<body>

    <h1>વાણી AI</h1>
    <p class="subtitle">તમારી પોતાની સ્માર્ટ આસિસ્ટન્ટ</p>

    <button id="start-vani-btn" onclick="initVani()">વાણી શરૂ કરો 🌟</button>
    
    <div id="main-interface">
        <button id="talk-btn" onclick="startListening()">વાણી સાથે વાત કરો 🎤</button>
        <div id="status">માઈક ચાલુ કરવા માટે બટન દબાવો...</div>
        
        <div id="chat-box">
            <p id="user-text">તમારો અવાજ અહીં દેખાશે...</p>
            <hr style="border-color: #FFD700;">
            <p id="jarvis-response">વાણીનો જવાબ અહીં આવશે...</p>
        </div>
    </div>

    <script>
        const k1 = "AQ.Ab8RN6KNNkKWXJyZ"; 
        const k2 = "YYYC_MtqRzT5qFdMKgmdUpoEbdc6XntVFQ";
        const API_KEY = k1 + k2; 

        const statusText = document.getElementById("status");
        const userText = document.getElementById("user-text");
        const jarvisResponse = document.getElementById("jarvis-response");

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'gu-IN';

        function initVani() {
            document.getElementById('start-vani-btn').style.display = 'none';
            document.getElementById('main-interface').style.display = 'block';
            const welcomeMsg = "સર, તમારો આજનો દિવસ કેવો છે?";
            jarvisResponse.innerText = welcomeMsg;
            speakText(welcomeMsg);
        }

        function startListening() {
            recognition.start();
            statusText.innerText = "વાણી સાંભળી રહી છે...";
            statusText.style.color = "#FFD700";
        }

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            userText.innerText = "તમે કહ્યું: " + transcript;
            statusText.innerText = "વાણી વિચારી રહી છે...";
            fetchGeminiResponse(transcript);
        };

        recognition.onerror = (event) => {
            statusText.innerText = "અવાજ પકડાયો નહીં. ફરી પ્રયત્ન કરો.";
        };

        async function fetchGeminiResponse(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            const data = { contents: [{ parts: [{ text: "તારું નામ વાણી છે. ટૂંકમાં ગુજરાતીમાં જવાબ આપ. પ્રશ્ન: " + text }] }] };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    // જો ગુગલ એરર આપે, તો સાચી એરર સ્ક્રીન પર દેખાશે
                    throw new Error(result.error ? result.error.message : "અજ્ઞાત ભૂલ");
                }

                const aiText = result.candidates[0].content.parts[0].text;
                jarvisResponse.innerText = aiText;
                statusText.innerText = "જવાબ તૈયાર છે!";
                speakText(aiText);
                
            } catch (error) {
                // એરર મેસેજ સ્ક્રીન પર પ્રિન્ટ થશે
                jarvisResponse.innerText = "ભૂલ: " + error.message;
            }
        }

        function speakText(text) {
            const speech = new SpeechSynthesisUtterance();
            speech.text = text;
            speech.lang = 'gu-IN'; 
            speech.pitch = 1.4; 
            speech.rate = 1.0;  
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
